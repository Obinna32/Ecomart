{% extends "shop/base.html" %}

{% block title %}Create an Account{% endblock title %}

{% block content %}
    <div style="max-width: 500px; margin:50px auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.05),">
        <h1>Join EcoMart</h1>
        <form method="POST">
            {% csrf_token %}
            {{form.as_p}}
            <button type="submit" class="btn" style="width: 100%; border: none; cursor: pointer;">Sign Up</button>
        </form>
        <p style="margin-top: 20px; text-align:center;">
            Already have an account? <a href="{% url "login" %}" style="color: #3498db;">Login here</a>
        </p>
    </div>
{% endblock content %}
